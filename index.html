<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef"><link rel="manifest" href="./manifest.json">
<title>My Notepad</title>
<style>
:root{--bg:#f7f4ef;--paper:#fffdf9;--ink:#252522;--muted:#77756f;--line:#e8e2d9;--accent:#5b6552;--soft:#e9ede5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--soft);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);color:white}button.danger{background:#f7e5e1;color:#8b2c1d}.app{max-width:1100px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px;gap:10px}h1{font-size:24px;margin:0}small,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.side,.main{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}.side h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 8px 10px}.folder-list{display:grid;gap:5px}.folder{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:transparent}.folder.active{background:var(--soft)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;margin-bottom:12px}.notes{display:grid;gap:8px}.note-row{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:white}.note-row.active{border-color:var(--accent);background:#f7f8f4}.note-row strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-row small{display:block;margin-top:5px}.editor{display:flex;flex-direction:column;gap:10px}.title{font-size:22px;font-weight:650;border:0;outline:0;background:transparent;width:100%;padding:6px 0}.body{width:100%;min-height:180px;resize:vertical;border:0;outline:0;background:transparent;line-height:1.55;padding:6px 0}.editor-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.drawbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}.drawhead{padding:9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#faf9f6;border-bottom:1px solid var(--line)}canvas{display:block;width:100%;height:220px;touch-action:none;background:white}.hidden{display:none!important}.empty{padding:30px 10px;text-align:center;color:var(--muted)}footer{text-align:center;padding:16px;color:var(--muted);font-size:12px}.pill{font-size:12px;background:#f1eee8;padding:4px 8px;border-radius:99px}.row{display:flex;gap:8px;align-items:center}.spacer{flex:1}#folderName{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{padding:10px}.side h3{margin-top:2px}.folder-list{display:flex;overflow:auto}.folder{white-space:nowrap;width:auto;flex-shrink:0}.side .folder-add{display:flex;gap:8px}.notes{grid-template-columns:1fr 1fr}.note-row{min-width:0}.body{min-height:140px}header{padding-top:14px}}
</style>
</head>
<body><div class="app">
<header><div><h1>My Notepad</h1><small>Just for you · saved on this iPad</small></div><button id="newNote" class="primary">＋ New note</button></header>
<div class="layout">
<aside class="side"><h3>Folders</h3><div id="folders" class="folder-list"></div><div class="row" style="margin-top:10px"><input id="folderName" placeholder="New folder name" aria-label="New folder name"><button id="addFolder">Add</button></div><p class="muted" style="font-size:12px;line-height:1.45">Notes stay in this browser on this device. Export backups regularly.</p></aside>
<main class="main">
<input id="search" class="search" placeholder="Search notes…" aria-label="Search notes">
<div class="tools"><button id="export">Export backup</button><button id="importBtn">Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>
<div id="noteList" class="notes"></div>
<section id="editor" class="editor hidden">
<div class="editor-meta"><span id="folderPill" class="pill"></span><span id="saveStatus" class="muted">Saved locally</span></div>
<input id="noteTitle" class="title" placeholder="Note title">
<textarea id="noteBody" class="body" placeholder="Start typing…"></textarea>
<div class="drawbox"><div class="drawhead"><strong>Handwriting & drawing</strong><span class="spacer"></span><label class="muted">Pen <input id="penColor" type="color" value="#252522" aria-label="Pen color"></label><button id="clearDrawing">Clear</button></div><canvas id="canvas" aria-label="Drawing area"></canvas></div>
<div class="editor-meta"><small id="updated"></small><div class="row"><button id="deleteNote" class="danger">Delete</button><button id="moveNote">Move folder</button></div></div>
</section>
<div id="empty" class="empty">Create your first note to get started ✨</div>
</main></div><footer>Private by design · no account · no cloud sync</footer></div>
<script>
const DB='my-notepad-db', STORE='notes', FOLDER='folders';let db,notes=[],folders=['Personal','Work','Ideas'],activeFolder='All notes',currentId=null,saveTimer=null, drawing=false, ctx, canvas, lastPoint=null, strokes=[];
const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore(STORE,{keyPath:'id'});d.createObjectStore(FOLDER,{keyPath:'name'})};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,item){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(item);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function remove(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function init(){await openDB();const saved=await all(FOLDER);if(saved.length)folders=saved.map(x=>x.name);else for(const name of folders)await put(FOLDER,{name});notes=await all(STORE);renderFolders();renderNotes();setupCanvas();if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('./sw.js')}catch(e){console.log('Offline setup unavailable until hosted on HTTPS',e)}}}
function renderFolders(){const el=$('folders');el.innerHTML='';['All notes',...folders].forEach(f=>{const b=document.createElement('button');b.className='folder'+(activeFolder===f?' active':'');b.textContent=(f==='All notes'?'▦  ':'▰  ')+f;b.onclick=()=>{activeFolder=f;renderFolders();renderNotes()};el.append(b)})}
function filtered(){const q=$('search').value.toLowerCase().trim();return notes.filter(n=>(activeFolder==='All notes'||n.folder===activeFolder)&&(!q||(`${n.title} ${n.body} ${n.folder}`).toLowerCase().includes(q))).sort((a,b)=>b.updated-a.updated)}
function renderNotes(){const el=$('noteList');el.innerHTML='';const arr=filtered();arr.forEach(n=>{const b=document.createElement('button');b.className='note-row'+(n.id===currentId?' active':'');const strong=document.createElement('strong');strong.textContent=n.title||'Untitled note';const sm=document.createElement('small');sm.textContent=new Date(n.updated).toLocaleDateString()+' · '+n.folder;b.append(strong,sm);b.onclick=()=>openNote(n.id);el.append(b)});$('empty').classList.toggle('hidden',arr.length>0||!!currentId);if(!arr.length&&!currentId)$('empty').textContent=$('search').value?'No matching notes. Try another search.':'No notes here yet. Create one to get started ✨';}
function openNote(id){const n=notes.find(x=>x.id===id);if(!n)return;currentId=id;$('editor').classList.remove('hidden');$('noteTitle').value=n.title||'';$('noteBody').value=n.body||'';$('folderPill').textContent=n.folder;$('updated').textContent='Updated '+new Date(n.updated).toLocaleString();strokes=n.strokes||[];drawStrokes();renderNotes();$('empty').classList.add('hidden')}
async function createNote(){const n={id:uid(),title:'',body:'',folder:folders[0]||'Personal',strokes:[],updated:Date.now()};notes.push(n);await put(STORE,n);activeFolder='All notes';renderFolders();openNote(n.id);$('noteTitle').focus()}
function snapshot(){return {id:currentId,title:$('noteTitle').value,body:$('noteBody').value,folder:notes.find(n=>n.id===currentId)?.folder||folders[0]||'Personal',strokes,updated:Date.now()}}
function scheduleSave(){if(!currentId)return;$('saveStatus').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const n=snapshot();await put(STORE,n);const i=notes.findIndex(x=>x.id===currentId);if(i<0)notes.push(n);else notes[i]=n;$('saveStatus').textContent='Saved locally';$('updated').textContent='Updated '+new Date(n.updated).toLocaleString();renderNotes()},250)}
$('newNote').onclick=createNote;$('search').oninput=renderNotes;$('noteTitle').oninput=scheduleSave;$('noteBody').oninput=scheduleSave;
$('addFolder').onclick=async()=>{const name=$('folderName').value.trim();if(!name)return;if(folders.some(x=>x.toLowerCase()===name.toLowerCase())){alert('That folder already exists.');return}folders.push(name);await put(FOLDER,{name});$('folderName').value='';activeFolder=name;renderFolders();renderNotes()};
$('deleteNote').onclick=async()=>{if(!currentId||!confirm('Delete this note permanently from this iPad?'))return;await remove(STORE,currentId);notes=notes.filter(n=>n.id!==currentId);currentId=null;$('editor').classList.add('hidden');renderNotes()};
$('moveNote').onclick=async()=>{if(!currentId)return;const n=notes.find(x=>x.id===currentId);const choice=prompt('Move to folder:\n'+folders.map((f,i)=>`${i+1}. ${f}`).join('\n')+'\n\nType the folder name: ',n.folder);if(choice&&folders.includes(choice)){n.folder=choice;n.updated=Date.now();await put(STORE,n);activeFolder='All notes';renderFolders();openNote(n.id)}};
$('export').onclick=async()=>{if(currentId){const n=snapshot();await put(STORE,n);const i=notes.findIndex(x=>x.id===currentId);if(i>=0)notes[i]=n}const data={app:'My Notepad',version:1,exportedAt:new Date().toISOString(),folders,notes};const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-notepad-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.notes)||!Array.isArray(data.folders))throw Error('Invalid backup');if(!confirm('Import notes? Notes with matching IDs will be replaced.'))return;for(const f of data.folders){if(!folders.includes(f)){folders.push(f);await put(FOLDER,{name:f})}}for(const n of data.notes){await put(STORE,n)}notes=await all(STORE);renderFolders();renderNotes();alert('Backup imported.')}catch(err){alert('Could not read that backup file.')}finally{e.target.value=''}};
function setupCanvas(){canvas=$('canvas');ctx=canvas.getContext('2d');resizeCanvas();canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);lastPoint=point(e);strokes.push({color:$('penColor').value,points:[lastPoint]});paintDot(lastPoint);scheduleSave()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);const s=strokes[strokes.length-1];s.points.push(p);paintLine(lastPoint,p,s.color);lastPoint=p;scheduleSave()});const end=()=>{drawing=false;lastPoint=null;scheduleSave()};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);window.addEventListener('resize',resizeCanvas)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function resizeCanvas(){if(!canvas)return;const old=strokes;const r=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(220*dpr));ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);drawStrokes()}
function paintLine(a,b,color){const r=canvas.getBoundingClientRect();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x*r.width,a.y*220);ctx.lineTo(b.x*r.width,b.y*220);ctx.stroke()}
function paintDot(p){const r=canvas.getBoundingClientRect();ctx.fillStyle=$('penColor').value;ctx.beginPath();ctx.arc(p.x*r.width,p.y*220,1.4,0,Math.PI*2);ctx.fill()}
function drawStrokes(){if(!ctx||!canvas)return;const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of strokes){for(let i=1;i<s.points.length;i++)paintLine(s.points[i-1],s.points[i],s.color);if(s.points.length===1)paintDot(s.points[0])}}
$('clearDrawing').onclick=()=>{if(confirm('Clear the drawing in this note?')){strokes=[];drawStrokes();scheduleSave()}};
init().catch(e=>{console.error(e);$('empty').textContent='Could not start local storage in this browser. Try opening this app in Safari after hosting it securely.'});
</script></body></html>
